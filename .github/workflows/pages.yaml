name: Validate and deploy ReachOut2Me
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
env:
  HUGO_VERSION: 0.169.0
  HUGO_PARAMS_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
  HUGO_PARAMS_BRANCH: main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Hugo (verify release checksum)
        shell: bash
        run: |
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 "$release/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --location --retry 3 "$release/hugo_${HUGO_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          grep " $archive\$" checksums.txt | sha256sum --check
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Build and validate profiles
        run: hugo --gc --minify --panicOnWarning --cacheDir "$RUNNER_TEMP/hugo-cache" --baseURL "https://reachout2me.online/"
      - name: Check generated pages and local links
        run: python3 scripts/check_site.py --base-path /
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Install Hugo
        shell: bash
        run: |
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 "$release/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --location --retry 3 "$release/hugo_${HUGO_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          grep " $archive\$" checksums.txt | sha256sum --check
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with production URL
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --panicOnWarning --cacheDir "$RUNNER_TEMP/hugo-cache" --baseURL "${PAGES_BASE_URL}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
